services:
  - type: web
    name: reverse-parking-relay
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: ALLOWED_ORIGINS
        value: https://bboy800820.github.io
