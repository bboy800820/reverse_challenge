  function visibleApp(){return layouts.find(app=>!app.closest('[data-variant]').hidden)||layouts[0];}
  function draw(){layouts.forEach((app,i)=>{if(app.closest('[data-variant]').hidden)return;app.querySelectorAll('canvas').forEach(canvas=>{const view=canvas.dataset.canvas;if(view==='map'||view==='mini')drawMap(canvas,view==='mini',palettes[i]);else drawPerspective(canvas,view,palettes[i]);});});}
  const activeInputs=new Map();
  const braking=()=>state.brakeHold||input.has('brake');
  function sync(){
    const angle=Math.round(state.steer*180/Math.PI),wheel=angle*12,speed=Math.abs(state.speed*3.6).toFixed(1);
    root.querySelectorAll('[data-speed],[data-dashspeed]').forEach(e=>e.textContent=speed);
    root.querySelectorAll('[data-gear],[data-dashgear]').forEach(e=>e.textContent=state.gear);
    root.querySelectorAll('[data-shift]').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.shift===state.gear)));
    root.querySelectorAll('[data-motion]').forEach(e=>e.textContent=state.paused?'已暫停':state.blocked?'碰撞停止':state.speed<-.02?'倒車中':state.speed>.02?'前進中':state.gear==='P'?'駐車':'已停穩');
    root.querySelectorAll('[data-steer]').forEach(e=>e.textContent=angle===0?'方向盤 0°':(angle<0?'左 ':'右 ')+Math.abs(wheel)+'°');
    root.querySelectorAll('[data-tire]').forEach(e=>e.textContent='前輪 '+Math.abs(angle)+'°');
    root.querySelectorAll('.rp-wheel,.rp-cockpitwheel').forEach(e=>e.style.transform='rotate('+wheel+'deg)');
    root.querySelectorAll('[data-move]').forEach(e=>e.dataset.held=String(e.dataset.move==='brake'?braking():input.has(e.dataset.move)));
    root.querySelectorAll('[data-brake-label]').forEach(e=>e.textContent=state.brakeHold?'已保持':input.has('brake')?'踩下中':'按住減速');
    root.querySelector('[data-hold]').textContent=state.brakeHold?'放開煞車保持':'踩住煞車保持';
    root.querySelector('[data-hold]').setAttribute('aria-pressed',String(state.brakeHold));
    root.querySelector('[data-pause]').textContent=state.paused?'繼續練習':'暫停';
    root.querySelector('[data-pathlabel]').textContent=state.gear==='D'?'前進路徑':'倒車路徑';
    const msg=state.paused?'模擬已暫停，按「繼續練習」恢復。':notice|| (state.blocked?'已碰到障礙物，踩煞車換檔後可離開。':state.gear==='P'?'駐車中，踩住煞車後選擇 D 或 R 檔。':state.gear==='N'?'空檔，油門不驅動車輛。':braking()?'煞車已踩住，停穩後可換檔。':'已入 '+state.gear+' 檔，鬆開煞車會低速蠕行。');
    const message=root.querySelector('[data-message]');if(message.textContent!==msg)message.textContent=msg;
    message.dataset.tone=state.blocked?'collision':notice?'warning':'normal';
    root.querySelectorAll('[data-aids]').forEach(e=>e.checked=aids);
    root.dataset.speed=state.speed.toFixed(5);root.dataset.carX=state.x.toFixed(5);root.dataset.carZ=state.z.toFixed(5);
    draw();
  }
  function tick(time){
    animation=null;if(state.paused){previousTime=0;sync();return;}
    const dt=previousTime?Math.min((time-previousTime)/1000,.04):.016;previousTime=time;
    if(input.has('left'))state.steer=clamp(state.steer-dt*.55,-.58,.58);
    if(input.has('right'))state.steer=clamp(state.steer+dt*.55,-.58,.58);
    if(state.gear==='P')state.speed=0;
    else if(braking())state.speed=Math.sign(state.speed)*Math.max(0,Math.abs(state.speed)-3.2*dt);
    else if(state.gear==='N')state.speed=Math.sign(state.speed)*Math.max(0,Math.abs(state.speed)-.32*dt);
    else {const sign=state.gear==='D'?1:-1;let magnitude=Math.abs(state.speed);if(input.has('throttle'))magnitude=Math.min(1.8,magnitude+1.15*dt);else magnitude+=clamp(.32-magnitude,-.55*dt,.45*dt);state.speed=sign*magnitude;}
    if(Math.abs(state.speed)>.0001){
      const next={...state,x:state.x+Math.sin(state.yaw)*state.speed*dt,z:state.z-Math.cos(state.yaw)*state.speed*dt,yaw:state.yaw+state.speed*dt/2.7*Math.tan(state.steer)};
      state.blocked=collision(next);
      if(state.blocked){state.speed=0;state.brakeHold=true;activeInputs.clear();input.clear();}
      else {state.x=next.x;state.z=next.z;state.yaw=next.yaw;const last=state.trail.at(-1);if(!last||Math.hypot(last.x-state.x,last.z-state.z)>.12){state.trail.push({x:state.x,z:state.z});if(state.trail.length>400)state.trail.shift();}}
    }
    sync();
    if(input.size||Math.abs(state.speed)>.0001||(!braking()&&(state.gear==='D'||state.gear==='R')))animation=requestAnimationFrame(tick);else previousTime=0;
  }
  function start(){if(!animation&&!state.paused)animation=requestAnimationFrame(tick);}
  function stop(){activeInputs.clear();input.clear();state.speed=0;state.paused=true;if(animation)cancelAnimationFrame(animation);animation=null;previousTime=0;sync();}
  function setAction(source,action,pressed){
    if(pressed){activeInputs.set(source,action);if(action==='throttle'&&braking())notice='請先放開煞車保持，再踩油門。';else notice='';}
    else activeInputs.delete(source);
    input=new Set(activeInputs.values());sync();start();
  }
  function shift(gear){
    if(state.paused){notice='請先繼續練習。';sync();return;}
    if(Math.abs(state.speed)>.02){notice='請先踩煞車，完全停穩後再換檔。';sync();return;}
    if(!braking()){notice='請踩住煞車，再選擇檔位。';sync();return;}
    state.gear=gear;state.speed=0;state.blocked=false;notice='';sync();remember();start();
  }
  function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{selectedStyle:'D 深藍儀表板',view:'駕駛座＋俯瞰',controls:'P/R/N/D 選檔，油門與煞車分開',trajectoryGuide:aids},privateContent:{aids}}).catch(()=>{});}
  root.querySelectorAll('[data-move]').forEach(button=>{
    button.addEventListener('pointerdown',e=>{e.preventDefault();button.focus();button.setPointerCapture(e.pointerId);setAction('pointer:'+e.pointerId,button.dataset.move,true);});
    for(const event of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(event,e=>setAction('pointer:'+e.pointerId,button.dataset.move,false));
  });
  root.querySelectorAll('[data-shift]').forEach(button=>button.addEventListener('click',()=>shift(button.dataset.shift)));
  root.querySelector('[data-hold]').addEventListener('click',()=>{state.brakeHold=!state.brakeHold;notice='';sync();start();});
  root.querySelector('[data-pause]').addEventListener('click',()=>{if(state.paused){state.paused=false;notice='';sync();start();}else stop();});
  root.querySelector('[data-center]').addEventListener('click',()=>{state.steer=0;sync();remember();});
  root.querySelector('[data-reset]').addEventListener('click',()=>{stop();state=initial();notice='';sync();});
  root.querySelector('[data-aids]').addEventListener('change',e=>{aids=e.target.checked;sync();remember();});
  const mapping={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'throttle',w:'throttle',W:'throttle',ArrowDown:'brake',s:'brake',S:'brake',' ':'brake'};
  document.addEventListener('keydown',e=>{if(!root.contains(document.activeElement)||document.activeElement.tagName==='INPUT')return;if(mapping[e.key]){e.preventDefault();setAction('key:'+e.code,mapping[e.key],true);}else if(['1','2','3','4'].includes(e.key)){e.preventDefault();if(!e.repeat)shift(['P','R','N','D'][Number(e.key)-1]);}else if(e.key.toLowerCase()==='c'){state.steer=0;sync();}else if(e.key==='Escape'){stop();}});
  document.addEventListener('keyup',e=>{if(mapping[e.key])setAction('key:'+e.code,mapping[e.key],false);});
  window.addEventListener('blur',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
  const saved=window.openai?.widgetState;if(typeof saved?.privateContent?.aids==='boolean')aids=saved.privateContent.aids;
  window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState;if(typeof s?.privateContent?.aids==='boolean'){aids=s.privateContent.aids;sync();}});
  new ResizeObserver(draw).observe(root);
  const themeObserver=new MutationObserver(()=>{palettes=layouts.map(palette);draw();});themeObserver.observe(document.documentElement,{attributes:true,attributeFilter:['class','data-theme','style']});window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{palettes=layouts.map(palette);draw();});
  if(globalThis.Tweak){layouts.forEach(app=>{const design={showGuide:true};new Tweak({container:app,onChange:()=>{aids=design.showGuide;sync();}}).addToggle(design,'showGuide',{label:'顯示預測軌跡'});});}
  sync();
})();
</script>
