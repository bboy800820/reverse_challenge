      '<div class="rp-content"><div class="rp-main"><div class="rp-toolbar"><div class="rp-scene-title">倒車入庫<span>練習場 · 目標車格 03</span></div><label class="rp-switch"><input type="checkbox" data-aids checked>軌跡輔助</label></div><div class="rp-stage">'+
      (cockpit?'<canvas data-canvas="front" role="img" aria-label="駕駛座前方視野示意"></canvas><div class="rp-windshield"></div><div class="rp-mirror"><canvas data-canvas="rear" role="img" aria-label="中央後視鏡"></canvas><span class="rp-mirrorlabel">中央後視鏡</span></div><div class="rp-side-mirror left"><canvas data-canvas="left" role="img" aria-label="左後視鏡"></canvas></div><div class="rp-side-mirror right"><canvas data-canvas="right" role="img" aria-label="右後視鏡"></canvas></div><div class="rp-driver-tag">駕駛座視角</div><div class="rp-dash"><div class="rp-cockpitwheel" aria-hidden="true"><b></b></div><div class="rp-dashscreen"><span data-dashgear>R</span> <span data-dashspeed>0.0</span><small>km/h</small></div></div>':'<canvas data-canvas="map" role="img" aria-label="俯瞰停車場，黃色是操作車輛，綠色是目標車格"></canvas><div class="rp-map-meta"><i></i> 俯瞰視角 · 全場固定</div><div class="rp-map-legend"><span><b class="rp-dot"></b>你的車</span><span><b class="rp-dot goal"></b>目標車格</span><span><b class="rp-dot path"></b>預測倒車路徑</span></div>')+
      '</div><div class="rp-caption"><span>'+(cockpit?'後視鏡與右側俯瞰同步顯示車輛位置':'車頭、車尾與前輪方向同步顯示')+'</span><span>示意車型 · 4.5 × 1.8 m</span></div></div><aside class="rp-side">'+

  });

  function predicted(){const p=[];let x=state.x,z=state.z,yaw=state.yaw;for(let i=0;i<72;i++){p.push({x,z,yaw});x-=Math.sin(yaw)*.11;z+=Math.cos(yaw)*.11;yaw-=.11/2.7*Math.tan(state.steer);}return p;}

  function overlaps(a,b){for(const poly of [a,b])for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],ax=-(q.z-p.z),az=q.x-p.x;const aa=a.map(v=>v.x*ax+v.z*az),bb=b.map(v=>v.x*ax+v.z*az);if(Math.max(...aa)<Math.min(...bb)||Math.max(...bb)<Math.min(...aa))return false;}return true;}
  function collision(s){const a=corners(s);if(a.some(p=>p.x<.65||p.x>23.35||p.z<1||p.z>16.5))return true;return parked.some(c=>overlaps(a,[{x:c.x-c.w/2,z:c.z-c.l/2},{x:c.x+c.w/2,z:c.z-c.l/2},{x:c.x+c.w/2,z:c.z+c.l/2},{x:c.x-c.w/2,z:c.z+c.l/2}]));}
  function canvasSize(canvas){const b=canvas.getBoundingClientRect();if(b.width<1||b.height<1)return null;const d=Math.min(window.devicePixelRatio||1,2);if(canvas.width!==Math.round(b.width*d)||canvas.height!==Math.round(b.height*d)){canvas.width=Math.round(b.width*d);canvas.height=Math.round(b.height*d);}const ctx=canvas.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return {ctx,w:b.width,h:b.height};}

  function visibleApp(){return layouts.find(app=>!app.closest('[data-variant]').hidden)||layouts[0];}

  function sync(){const angle=Math.round(state.steer*180/Math.PI),wheel=Math.round(angle*10),speed=Math.abs(state.speed*3.6).toFixed(1),gear=state.speed>0?'D':'R';root.querySelectorAll('[data-speed],[data-dashspeed]').forEach(e=>e.textContent=speed);root.querySelectorAll('[data-gear],[data-dashgear]').forEach(e=>e.textContent=gear);root.querySelectorAll('[data-motion]').forEach(e=>e.textContent=state.blocked?'碰撞停止':state.speed<0?'倒車中':state.speed>0?'前進中':'停車中');root.querySelectorAll('[data-steer]').forEach(e=>e.textContent=angle===0?'方向盤已回正':'方向盤'+(angle<0?'左轉 ':'右轉 ')+Math.abs(wheel)+'°');root.querySelectorAll('[data-tire]').forEach(e=>e.textContent='前輪'+(angle===0?'直行':(angle<0?'左轉 ':'右轉 ')+Math.abs(angle)+'°'));root.querySelectorAll('.rp-wheel,.rp-cockpitwheel').forEach(e=>e.style.transform='rotate('+wheel+'deg)');root.querySelectorAll('[data-move]').forEach(e=>e.dataset.held=String(input.has(e.dataset.move)));root.querySelectorAll('[data-status]').forEach(e=>{e.classList.toggle('rp-warning',state.blocked);e.querySelector('span').textContent=state.blocked?'碰撞停止，可向反方向離開':Math.abs(state.speed)>.01?'練習中':'可開始操作';});root.querySelectorAll('[data-aids]').forEach(e=>e.checked=aids);draw();}
